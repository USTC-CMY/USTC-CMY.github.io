<section class="comment-area">
    <div class="comment-wrapper">
        {% if site.comments == 'utteranc' and site.comments_opts.repo %}
          <div id="comment-layout">
            <script src="https://utteranc.es/client.js"
                    repo="{{ site.comments_opts.repo }}"
                    issue-term="{{ site.comments_opts.issue_term | default: page.url }}"
                    label="{{ site.comments_opts.label | default: 'comments' }}"
                    theme="{{ site.comments_opts.theme | default: 'preferred-color-scheme' }}"
                    crossorigin="anonymous"
                    async>
            </script>
          </div>
        {% endif %}
    </div>
</section> <!-- End Comment Area -->
