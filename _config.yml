# Site settings
title: MYChen's Blog
description: 'Notes on machine learning, neural networks, and coding in Python.'
permalink: ':title:output_ext'
baseurl: "/" # the subpath of your site, e.g. /blog
url: "https://ustc-cmy.github.io" # the base hostname & protocol for your site, e.g. http://example.com
logo: "/assets/img/branding/wordmark.png"
logo-icon: "/assets/img/branding/symbol.png"
logo-icon-SEO: "/assets/img/branding/symbol.png" # must be a non SVG file
logo-dark: "/assets/img/branding/wordmark-dark.png"

# Default social/preview image used when a page has no `img` in its front matter
default_image: "/assets/img/branding/symbol.png"

# Keywords used in meta tags when a page has no tags
keywords: "machine learning, neural networks, python, deep learning, coding"

# Night/Dark mode
# Default mode is "auto", "auto" is for auto nightshift
# (19:00 - 07:00), "manual" is for manual toggle, and
# "on/off" is for default on/off.
#
# Whatever the user's choice is, it will supersede the
# default setting of the site and be kept during the
# visit (session). Only the dark mode setting is "manual",
# it will be always kept on every visit (i.e. no matter
# the browser is closed or not)
night_mode: "auto"

highlight_theme: syntax-base16.monokai.dark # select a dark theme for the code highlighter if needed

# Author settings
author: MY Chen # add your name
author-pic: Myself_Neon_grey.jpg
about-author:  USTC, Master

# Contact links
email: my838616034@gmail.com # Add your Email address
website: https://ustc-cmy.github.io # Add your website
github: USTC-CMY # Add your Github handle


# Newsletter
# The original theme shipped with the template author's Mailchimp account here.
# That has been removed: any subscriber would have been added to a stranger's
# mailing list, and the page loaded their tracking script. Subscriptions are now
# handled by the RSS feed (feed.xml), rendered as a card under each post.

# Tracker
# NOTE: verify this is YOUR GA4 property. The upstream theme hard-coded
# G-4CVW6NPXTX in _includes/analytics.html, which suggests it belongs to the
# theme author. If it is not yours, delete this line — analytics.html skips
# rendering entirely when it is empty.
analytics: G-4CVW6NPXTX

# Paginate
paginate: 6
paginate_path: 'page:num'
words_per_minute: 200

extensions:
  mermaid_enable: true

# Comments
comments: # disabled by default; set to utteranc and fill comments_opts.repo to enable
comments_opts:
  comments_curtain: yes # leave empty to show the comment embed directly
  repo: # e.g. USTC-CMY/USTC-CMY.github.io
  issue_term:
  label:
  theme: preferred-color-scheme # e.g. github-light / github-dark / preferred-color-scheme

# Build settings
markdown: kramdown
mathjax: true
highlighter: rouge
compress_html:
  clippings: all
  comments: all
  startings: [html, head, body]

# Outputting
timezone: Asia/Shanghai # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

category_archive:
  type: liquid
  path: /categories/

# styles are hand-written in assets/css/main.css — no Sass pipeline any more
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap

include: [_pages]
exclude: ["node_modules", "vendor"]